name: Free private paper bots scheduler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/paper-bots.yml"
  schedule:
    # Public repositories avoid private-repository schedule inactivity.
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-paper-bots-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate private workflow token
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$PRIVATE_REPO_TOKEN" ]]; then
            echo "::error::Missing Actions secret: PRIVATE_REPO_TOKEN"
            exit 1
          fi

      - name: Dispatch private 15m paper monitor
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/leekyuan/btc-15-min-ote-strategy/actions/workflows/h_ote1_forward.yml/dispatches \
            --data '{"ref":"main"}'
          echo "15m private workflow dispatched; strategy and Telegram secrets remain private."

      - name: Dispatch private 4h paper monitor
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/leekyuan/btc-4h-signal-bot/actions/workflows/btc-eth-signal-alert.yml/dispatches \
            --data '{"ref":"main"}'
          echo "4h private workflow dispatched; it exits quickly when no 4h close is due."

      - name: Keep the public schedule active
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          today="$(date -u +%F)"
          if [[ -f runtime/heartbeat.json ]] \
            && grep -Fq "\"date_utc\": \"$today\"" runtime/heartbeat.json; then
            echo "Daily public heartbeat already recorded."
            exit 0
          fi
          mkdir -p runtime
          timestamp="$(date -u +%FT%TZ)"
          cat > runtime/heartbeat.json <<EOF
          {
            "date_utc": "$today",
            "updated_at_utc": "$timestamp"
          }
          EOF
          git config user.name "free-bot-scheduler[bot]"
          git config user.email "free-bot-scheduler@users.noreply.github.com"
          git add runtime/heartbeat.json
          git commit -m "chore: keep scheduled runner active [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
